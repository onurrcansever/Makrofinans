# Masaüstü uygulaması — yerel sunucu (internet gerekmez)
[server]
headless = true
port = 8502
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = false
fileWatcherType = "none"
# Uzun canlı veri çekiminde WebSocket kopmasını azaltır
enableWebsocketCompression = true
maxUploadSize = 400

[runner]
fastReruns = true

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"
serverPort = 8502

[theme]
base = "dark"
backgroundColor = "#131722"
secondaryBackgroundColor = "#1e222d"
textColor = "#d1d4dc"
primaryColor = "#2962ff"
font = "sans serif"
