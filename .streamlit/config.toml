# Masaüstü uygulaması — yerel sunucu (internet gerekmez)
[server]
headless = true
port = 8502
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = false
# Uzun canlı veri çekiminde WebSocket kopmasını azaltır
enableWebsocketCompression = true
maxUploadSize = 400
# Dosya kaydında otomatik yeniden çalıştır (elle çık-gir gerekmez).
# app.py gibi ana script anında yansır; import edilen modüller (ör.
# signal_engine/*) değişince yine bir kez süreç restart gerekebilir.
fileWatcherType = "auto"
runOnSave = true

[runner]
fastReruns = true

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"
serverPort = 8502

# Native Streamlit bileşenleri (buton, tablo, info) bu paleti kullanır.
# base=light iken PDF hazırla beyaz zemin + CSS açık yazı = okunmazdı.
[theme]
base = "dark"
backgroundColor = "#181A20"
secondaryBackgroundColor = "#1E2329"
textColor = "#EAECEF"
primaryColor = "#14B8A6"
font = "sans serif"
