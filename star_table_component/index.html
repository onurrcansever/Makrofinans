<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --border: #2B3139;
      --panel: #1E2329;
      --text: #EAECEF;
      --muted: #848E9C;
      --th-bg: #2B3139;
      --hover: rgba(20,184,166,0.06);
      --up: #0ECB81;
      --down: #F6465D;
      --accent: #14B8A6;
      --font: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: var(--font);
      color: var(--text);
    }
    .wrap {
      overflow: auto;
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
      font-size: 13px;
      font-weight: 400;
    }
    th {
      position: sticky;
      top: 0;
      background: var(--th-bg);
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      z-index: 1;
    }
    td {
      padding: 8px 12px;
      height: 38px;
      box-sizing: border-box;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.25;
      white-space: nowrap;
      color: var(--text);
    }
    tbody tr:hover td {
      background: var(--hover);
    }
    th.star, td.star, th.act, td.act {
      text-align: center;
      width: 44px;
    }
    button.star-btn {
      appearance: none;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: var(--text);
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
      padding: 2px 4px;
    }
    button.star-btn:hover { color: var(--accent); }
    button.act-btn {
      appearance: none;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      padding: 2px 6px;
    }
    button.act-btn:hover { color: var(--text); }
    .num {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .ctr {
      text-align: center;
      width: 40px;
    }
    th.ctr { width: 40px; }
    .empty {
      padding: 16px;
      color: var(--muted);
      font-size: 14px;
      font-family: var(--font);
    }
  </style>
</head>
<body>
  <div id="root" class="wrap"></div>
  <script>
    // Streamlit Components v1 — iframe protokolü (declare_component)
    const Streamlit = {
      setComponentValue(value) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value,
        }, "*");
      },
      setFrameHeight(height) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setFrameHeight",
          height,
        }, "*");
      },
      setComponentReady() {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:componentReady",
          apiVersion: 1,
        }, "*");
      },
    };

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function render(args) {
      const root = document.getElementById("root");
      const cols = args.columns || [];
      const rows = args.rows || [];
      const maxH = args.max_height || 480;
      const hasAction = !!args.has_action;

      root.style.maxHeight = maxH + "px";

      if (!rows.length) {
        root.innerHTML = '<div class="empty">Tablo boş.</div>';
        Streamlit.setFrameHeight(48);
        return;
      }

      let head = '<th class="star">⭐</th>';
      for (const c of cols) {
        const hc = (c === "Sinyal" || c === "Momentum") ? " class=\"ctr\"" : "";
        head += `<th${hc}>${esc(c)}</th>`;
      }
      if (hasAction) head += '<th class="act">⋯</th>';

      let body = "";
      rows.forEach((row, i) => {
        const star = row.filled ? "★" : "☆";
        const pad = row.pad_px ? `padding-top:${row.pad_px}px;padding-bottom:${row.pad_px}px;` : "";
        let tds = `<td class="star" style="${pad}">` +
          `<button type="button" class="star-btn" data-i="${i}" title="Favori ekle/çıkar">${star}</button></td>`;
        const cells = row.cells || [];
        cols.forEach((c, ci) => {
          const cell = cells[ci] || {};
          let align = "";
          if (cell.align === "right") align = "num";
          else if (cell.align === "center" || c === "Sinyal" || c === "Momentum") align = "ctr";
          const html = cell.html != null ? cell.html : esc(cell.text ?? "—");
          tds += `<td class="${align}" style="${pad}" title="${esc(cell.title ?? cell.text ?? "")}">${html}</td>`;
        });
        if (hasAction) {
          const rid = esc(row.action_id || "");
          tds += `<td class="act" style="${pad}">` +
            `<button type="button" class="act-btn" data-act="${rid}" title="İşlemler">⋯</button></td>`;
        }
        body += `<tr data-row="${i}">${tds}</tr>`;
      });

      root.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;

      root.querySelectorAll("button.star-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          const i = parseInt(btn.getAttribute("data-i"), 10);
          Streamlit.setComponentValue({ kind: "star", i, t: Date.now() });
        });
      });
      root.querySelectorAll("button.act-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          const id = btn.getAttribute("data-act") || "";
          Streamlit.setComponentValue({ kind: "action", id, t: Date.now() });
        });
      });

      const h = Math.min(maxH, root.scrollHeight + 4);
      Streamlit.setFrameHeight(Math.max(80, h));
    }

    function onMessage(event) {
      const data = event.data;
      if (!data || data.type !== "streamlit:render") return;
      render(data.args || {});
    }

    window.addEventListener("message", onMessage);
    Streamlit.setComponentReady();
    // İlk boş çerçeve
    Streamlit.setFrameHeight(80);
  </script>
</body>
</html>
