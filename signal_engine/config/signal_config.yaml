# Signal Engine v2 — tek kaynak (README_SIGNALS.md ile senkron tutulur)
version: 2

history:
  live_period: "2y"       # tarama indirmesi
  backtest_period: "5y"   # P(fill) ve backtest
  min_bars: 60

weights:
  trend: 0.22
  mean_reversion: 0.18
  volatility: 0.18
  relative_strength: 0.22
  liquidity: 0.20

regime:
  adx_period: 14
  adx_trend_min: 22.0
  high_vol_ratio: 1.45    # vol30 / vol90
  high_vol_abs_pct: 35.0  # yıllık %

entry:
  trend_pullback_pct: 0.05      # TRENDING_UP: ~5% geri çekilme
  trend_sma_prefer: ["sma20", "sma50"]
  deep_52h_pct: 0.88            # TRENDING_DOWN: 52H'nin %88'i
  p_fill_horizon_days: 90
  p_fill_dca_threshold: 0.20
  p_fill_spot_threshold: 0.95
  shallow_max_pct: 0.08

decisions:
  strong_buy: 76
  buy: 68
  watch: 52
  wait: 42
  reduce: 0
  hysteresis_margin: 3.0

# Kısa momentum (trend_factor) — varsayılan kapalı; backtest onaylarsa enabled: true
short_momentum:
  enabled: true
  preset: siki   # off | small | temkinli | siki
  # Canlı izleme / rollback (ops)
  # - İlk 30 günde canlı whipsaw_rate > backtest_ref * rollback_whipsaw_mult → enabled: false
  # - Haftalık: scripts/monitor_short_mom_live.py
  monitor:
    backtest_ref_whipsaw_rate: 0.001064   # siki A/B
    backtest_ref_upgrade_avg_1m: 1.37
    rollback_whipsaw_mult: 2.0            # 2× backtest → geri al
    rollback_window_days: 30
  presets:
    small:
      m1_hi: [8.0, 6.0]
      m1_mid: [3.0, 3.0]
      m1_lo: [-5.0, -4.0]
      m3_hi: [12.0, 5.0]
      m3_mid: [5.0, 2.0]
      m3_lo: [-8.0, -4.0]
    temkinli:
      m1_hi: [8.0, 2.0]
      m1_mid: [3.0, 1.0]
      m1_lo: [-5.0, -2.0]
      m3_hi: [12.0, 6.0]
      m3_mid: [5.0, 3.0]
      m3_lo: [-8.0, -4.0]
    siki:
      m1_hi: [8.0, 2.0]
      m1_mid: [3.0, 1.0]
      m1_lo: [-5.0, -2.0]
      m3_hi: [12.0, 4.0]
      m3_mid: [5.0, 2.0]
      m3_lo: [-8.0, -3.0]

benchmarks:
  bist: "XU100.IS"
  us: "^GSPC"
  nasdaq: "^IXIC"
  etf_global: "^GSPC"

asset_classes:
  etf_broad: ["abd", "dunya", "hisse_global", "temettu", "avrupa", "europa", "esg"]
  etf_other: ["teknoloji", "gelisen", "tahvil", "altin", "emtia"]
  # Spot GC=F/SI=F → asset_class_for="emtia" (benchmark yok, rel=50)
