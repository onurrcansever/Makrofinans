<div aria-hidden="true" style="display:none!important;height:0!important;overflow:hidden!important;margin:0!important;padding:0!important;">
<style id="tv-theme-style">
:root {
  --bg: #131722;
  --panel: #1e222d;
  --panel-hover: #2a2e39;
  --border: #2a2e39;
  --text: #d1d4dc;
  --text-muted: #787b86;
  --up: #26a69a;
  --down: #ef5350;
  --accent: #2962ff;
  --warn: #ff9800;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

html, body, [data-testid="stAppViewContainer"], [data-testid="stHeader"] {
  background-color: var(--bg) !important;
  color: var(--text) !important;
  font-family: var(--font-sans) !important;
}

[data-testid="stAppViewContainer"] > .main {
  background-color: var(--bg) !important;
}

.block-container {
  padding-top: 1.5rem !important;
  max-width: 100% !important;
}

h1 {
  font-size: 28px !important;
  font-weight: 700 !important;
  color: var(--text) !important;
  letter-spacing: -0.02em;
}

h2, h3, h4,
[data-testid="stMarkdownContainer"] h1,
[data-testid="stMarkdownContainer"] h2,
[data-testid="stMarkdownContainer"] h3 {
  color: var(--text) !important;
}

p, li, span, label, .stCaption,
[data-testid="stMarkdownContainer"] p {
  color: var(--text) !important;
}

.stCaption, small {
  color: var(--text-muted) !important;
}

[data-testid="stSidebar"] {
  background-color: var(--panel) !important;
  border-right: 1px solid var(--border) !important;
}

[data-testid="stSidebar"] [data-testid="stMarkdownContainer"] h1,
[data-testid="stSidebar"] [data-testid="stMarkdownContainer"] h2,
[data-testid="stSidebar"] [data-testid="stMarkdownContainer"] h3 {
  font-size: 11px !important;
  text-transform: uppercase !important;
  letter-spacing: 0.5px !important;
  color: var(--text-muted) !important;
  font-weight: 600 !important;
}

[data-testid="stSidebar"] label {
  color: var(--text) !important;
}

[data-testid="stSidebar"] [data-baseweb="radio"] > div {
  gap: 2px !important;
}

[data-testid="stSidebar"] [data-baseweb="radio"] label {
  background: transparent !important;
  border-left: 3px solid transparent !important;
  border-radius: 4px !important;
  padding: 8px 12px !important;
  margin: 0 !important;
  color: var(--text-muted) !important;
  width: 100%;
}

[data-testid="stSidebar"] [data-baseweb="radio"] label:has(input:checked) {
  background: #2962ff14 !important;
  border-left-color: var(--accent) !important;
  color: var(--text) !important;
  font-weight: 600 !important;
}

[data-testid="stSidebar"] hr {
  border-color: var(--border) !important;
}

[data-testid="stMetric"] {
  background: var(--panel) !important;
  border: 1px solid var(--border) !important;
  border-radius: 8px !important;
  padding: 12px 16px !important;
}

[data-testid="stMetricLabel"] {
  font-size: 11px !important;
  color: var(--text-muted) !important;
  text-transform: uppercase !important;
  letter-spacing: 0.4px !important;
}

[data-testid="stMetricValue"] {
  font-family: var(--font-mono) !important;
  font-variant-numeric: tabular-nums !important;
  color: var(--text) !important;
  font-size: 20px !important;
}

[data-testid="stMetricDelta"] svg {
  display: none;
}

[data-testid="stExpander"] {
  background: var(--panel) !important;
  border: 1px solid var(--border) !important;
  border-radius: 8px !important;
  overflow: hidden;
}

[data-testid="stExpander"] summary {
  color: var(--text) !important;
  font-weight: 600 !important;
}

.stButton > button[kind="primary"],
.stButton > button[data-testid="baseButton-primary"] {
  background-color: var(--accent) !important;
  color: #fff !important;
  border: none !important;
  border-radius: 6px !important;
  font-weight: 600 !important;
}

.stButton > button:not([kind="primary"]):not([data-testid="baseButton-primary"]) {
  background: transparent !important;
  color: var(--text) !important;
  border: 1px solid var(--border) !important;
  border-radius: 6px !important;
}

.stButton > button:hover {
  background-color: var(--panel-hover) !important;
}

[data-testid="stAlert"] {
  background-color: var(--panel) !important;
  border: 1px solid var(--border) !important;
  color: var(--text) !important;
}

.stTabs [data-baseweb="tab-list"] {
  background: transparent !important;
  border-bottom: 1px solid var(--border) !important;
}

.stTabs [data-baseweb="tab"] {
  color: var(--text-muted) !important;
}

.stTabs [aria-selected="true"] {
  color: var(--accent) !important;
  border-bottom: 2px solid var(--accent) !important;
}

div[data-baseweb="select"] > div,
div[data-baseweb="input"] > div {
  background-color: var(--panel) !important;
  border-color: var(--border) !important;
  color: var(--text) !important;
}

.stProgress > div > div {
  background-color: var(--accent) !important;
}

[data-testid="stStatusWidget"] {
  background: var(--panel) !important;
  border: 1px solid var(--border) !important;
}

.stCode, code {
  background: var(--panel-hover) !important;
  color: var(--text) !important;
  border: 1px solid var(--border) !important;
}

hr {
  border-color: var(--border) !important;
}

#MainMenu { visibility: hidden; }
footer { visibility: hidden; }

/* Form — borderless, tight */
[data-testid="stForm"] {
  border: none !important;
  padding: 0 !important;
  background: transparent !important;
}

/* Sidebar brand heading */
[data-testid="stSidebar"] [data-testid="stMarkdownContainer"] h2 {
  font-size: 18px !important;
  text-transform: none !important;
  letter-spacing: -0.01em !important;
  color: var(--text) !important;
  font-weight: 700 !important;
}

/* Sidebar section subheaders */
[data-testid="stSidebar"] [data-testid="stHeading"] {
  color: var(--text-muted) !important;
  font-size: 11px !important;
  text-transform: uppercase !important;
  letter-spacing: 0.5px !important;
  font-weight: 600 !important;
}

/* Spinner overlay */
[data-testid="stSpinner"] {
  color: var(--accent) !important;
}

/* Better number input */
[data-testid="stNumberInput"] input {
  background: var(--panel) !important;
  border: 1px solid var(--border) !important;
  color: var(--text) !important;
  border-radius: 6px !important;
  font-family: var(--font-mono) !important;
}

/* Form submit button glow on hover */
[data-testid="stFormSubmitButton"] > button {
  background-color: var(--accent) !important;
  color: #fff !important;
  font-weight: 600 !important;
  border-radius: 6px !important;
  border: none !important;
  transition: box-shadow 0.2s ease !important;
}
[data-testid="stFormSubmitButton"] > button:hover {
  box-shadow: 0 0 0 3px rgba(41,98,255,0.3) !important;
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
</div>
