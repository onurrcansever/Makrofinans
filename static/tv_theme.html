<div aria-hidden="true" style="display:none!important;height:0!important;overflow:hidden!important;margin:0!important;padding:0!important;">
<style id="modulcheck-theme-style">
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap");

/* ══════════════════════════════════════════
   Makrofinans — koyu finans paneli
   Surfaces: #181A20 / #1E2329 / #2B3139
   Text:     #EAECEF / #848E9C
   P&L:      #0ECB81 / #F6465D
   Accent:   #14B8A6
   ══════════════════════════════════════════ */

:root {
  --mc-nav:      #1E2329;
  --mc-sidebar:  #1E2329;
  --mc-sidebar2: #2B3139;
  --mc-content:  #181A20;
  --mc-card:     #1E2329;
  --mc-border:   #2B3139;
  --mc-text:     #EAECEF;
  --mc-muted:    #848E9C;
  --mc-accent:   #14B8A6;
  --mc-accent-h: #0D9488;
  --mc-up:       #0ECB81;
  --mc-down:     #F6465D;
  --mc-warn:     #F59E0B;
  --mc-sb-text:  #EAECEF;
  --mc-sb-muted: #848E9C;
  --mc-font:     "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mc-font-title: "Lexend", "IBM Plex Sans", system-ui, sans-serif;
  --mc-mono:     "IBM Plex Sans", ui-monospace, SFMono-Regular, Menlo, monospace;
  --mc-radius:   12px;
  --mc-radius-sm: 8px;
}

html, body {
  font-family: var(--mc-font) !important;
  background-color: var(--mc-content) !important;
  color: var(--mc-text) !important;
  color-scheme: dark !important;
}

[data-testid="stAppViewContainer"] {
  background-color: var(--mc-content) !important;
  font-family: var(--mc-font) !important;
}

[data-testid="stAppViewContainer"] > .main {
  background-color: var(--mc-content) !important;
}

.block-container {
  padding-top: 1rem !important;
  max-width: 100% !important;
  background-color: var(--mc-content) !important;
}

[data-testid="stHeader"] {
  background-color: var(--mc-nav) !important;
  border-bottom: 1px solid var(--mc-border) !important;
  height: 56px !important;
}

[data-testid="stToolbar"] {
  background-color: var(--mc-nav) !important;
}

[data-testid="stToolbar"] button,
[data-testid="stToolbar"] svg {
  color: var(--mc-muted) !important;
  fill: var(--mc-muted) !important;
}

[data-testid="stDecoration"] {
  background: var(--mc-nav) !important;
}

h1 {
  font-family: var(--mc-font-title) !important;
  font-size: 22px !important;
  font-weight: 600 !important;
  color: var(--mc-text) !important;
  letter-spacing: -0.02em !important;
}

h2, h3, h4,
[data-testid="stMarkdownContainer"] h1,
[data-testid="stMarkdownContainer"] h2,
[data-testid="stMarkdownContainer"] h3 {
  color: var(--mc-text) !important;
  font-family: var(--mc-font-title) !important;
}

p, li, label,
[data-testid="stMarkdownContainer"] p,
[data-testid="stMarkdownContainer"] li,
[data-testid="stMarkdownContainer"] label {
  color: var(--mc-text) !important;
  font-family: var(--mc-font) !important;
  font-size: 14px !important;
  line-height: 1.5 !important;
}

[data-testid="stMarkdownContainer"] span:not([data-testid="stExpanderToggleIcon"]) {
  font-family: inherit !important;
}

.stCaption, small, [data-testid="stCaptionContainer"] {
  color: var(--mc-muted) !important;
  font-size: 12px !important;
  line-height: 1.45 !important;
}

/* ── SIDEBAR ──────────────────────────────── */
[data-testid="stSidebar"] {
  background-color: var(--mc-sidebar) !important;
  border-right: 1px solid var(--mc-border) !important;
}

[data-testid="stSidebar"] > div:first-child {
  background-color: var(--mc-sidebar) !important;
}

[data-testid="stSidebar"] [data-testid="stMarkdownContainer"] h2 {
  font-family: var(--mc-font-title) !important;
  font-size: 17px !important;
  font-weight: 600 !important;
  color: var(--mc-text) !important;
  letter-spacing: -0.01em !important;
  text-transform: none !important;
  padding: 4px 0 2px !important;
}

[data-testid="stSidebar"] [data-testid="stHeading"],
[data-testid="stSidebar"] [data-testid="stMarkdownContainer"] h3 {
  font-size: 10px !important;
  font-weight: 600 !important;
  text-transform: uppercase !important;
  letter-spacing: 0.7px !important;
  color: var(--mc-sb-muted) !important;
  padding: 14px 0 4px !important;
}

[data-testid="stSidebar"] p,
[data-testid="stSidebar"] span,
[data-testid="stSidebar"] label {
  color: var(--mc-sb-text) !important;
}

[data-testid="stSidebar"] .stCaption {
  color: var(--mc-sb-muted) !important;
}

[data-testid="stSidebar"] hr {
  border-color: var(--mc-border) !important;
  margin: 8px 0 !important;
}

[data-testid="stSidebar"] div[data-baseweb="select"] > div {
  background-color: var(--mc-sidebar2) !important;
  border-color: var(--mc-border) !important;
  color: var(--mc-sb-text) !important;
  border-radius: var(--mc-radius-sm) !important;
}

[data-testid="stSidebar"] div[data-baseweb="select"] svg {
  fill: var(--mc-sb-text) !important;
}

[data-testid="stSidebar"] [data-baseweb="menu"] {
  background-color: var(--mc-card) !important;
  border: 1px solid var(--mc-border) !important;
}

[data-testid="stSidebar"] [data-baseweb="menu"] li {
  color: var(--mc-sb-text) !important;
}

[data-testid="stSidebar"] [data-baseweb="menu"] li:hover {
  background-color: rgba(20,184,166,0.12) !important;
}

[data-testid="stSidebar"] [data-baseweb="radio"] > div {
  gap: 2px !important;
}

[data-testid="stSidebar"] [data-baseweb="radio"] label {
  background: transparent !important;
  border: none !important;
  border-radius: var(--mc-radius) !important;
  padding: 9px 14px !important;
  margin: 1px 4px !important;
  color: var(--mc-sb-muted) !important;
  width: calc(100% - 8px) !important;
  font-size: 13.5px !important;
  font-weight: 500 !important;
  transition: background 0.12s ease, color 0.12s ease !important;
  position: relative !important;
}

[data-testid="stSidebar"] [data-baseweb="radio"] label:hover {
  background: var(--mc-sidebar2) !important;
  color: var(--mc-text) !important;
  cursor: pointer !important;
}

[data-testid="stSidebar"] [data-baseweb="radio"] label:has(input:checked) {
  background: rgba(20,184,166,0.12) !important;
  color: var(--mc-text) !important;
  font-weight: 600 !important;
  box-shadow: inset 3px 0 0 0 var(--mc-accent) !important;
}

[data-testid="stSidebar"] [data-baseweb="radio"] input[type="radio"] {
  display: none !important;
}

[data-testid="stSidebar"] [data-testid="stNumberInput"] input {
  background: var(--mc-sidebar2) !important;
  border: 1px solid var(--mc-border) !important;
  color: var(--mc-sb-text) !important;
  border-radius: var(--mc-radius-sm) !important;
  font-family: var(--mc-mono) !important;
}

[data-testid="stSidebar"] [data-testid="stNumberInput"] button {
  background: var(--mc-sidebar2) !important;
  border-color: var(--mc-border) !important;
  color: var(--mc-sb-text) !important;
}

[data-testid="stSidebar"] [data-testid="stSlider"] > div > div > div {
  background: var(--mc-accent) !important;
}

[data-testid="stSidebar"] [data-testid="stToggle"] {
  color: var(--mc-sb-text) !important;
}

[data-testid="stSidebar"] .stButton > button {
  background: var(--mc-accent) !important;
  color: #0B1215 !important;
  border: none !important;
  border-radius: var(--mc-radius-sm) !important;
  font-weight: 600 !important;
  font-size: 13px !important;
  min-height: 36px !important;
}

[data-testid="stSidebar"] .stButton > button:hover {
  background: var(--mc-accent-h) !important;
}

[data-testid="stSidebar"] [data-testid="stFormSubmitButton"] > button {
  background: var(--mc-accent) !important;
  color: #0B1215 !important;
  border: none !important;
  border-radius: var(--mc-radius-sm) !important;
  font-weight: 600 !important;
  min-height: 36px !important;
}

/* ── MAIN ─────────────────────────────────── */
[data-testid="stMetric"] {
  background: var(--mc-card) !important;
  border: 1px solid var(--mc-border) !important;
  border-radius: var(--mc-radius) !important;
  padding: 12px 14px !important;
  box-shadow: none !important;
}

[data-testid="stMetricLabel"] {
  font-size: 11px !important;
  color: var(--mc-muted) !important;
  text-transform: uppercase !important;
  letter-spacing: 0.45px !important;
  font-weight: 600 !important;
}

[data-testid="stMetricValue"] {
  font-family: var(--mc-font) !important;
  font-variant-numeric: tabular-nums !important;
  font-feature-settings: "tnum" !important;
  color: var(--mc-text) !important;
  font-size: 20px !important;
  font-weight: 600 !important;
  letter-spacing: -0.02em !important;
  line-height: 1.2 !important;
}

[data-testid="stMetricDelta"] {
  font-size: 12px !important;
  font-family: var(--mc-font) !important;
  margin-top: 4px !important;
}

[data-testid="stMetricDelta"] svg {
  display: none;
}

[data-testid="stExpander"] {
  background: var(--mc-card) !important;
  border: 1px solid var(--mc-border) !important;
  border-radius: var(--mc-radius) !important;
  overflow: hidden !important;
  box-shadow: none !important;
  margin-bottom: 8px !important;
}

[data-testid="stExpander"] details > summary {
  display: flex !important;
  align-items: center !important;
  gap: 10px !important;
  list-style: none !important;
  cursor: pointer !important;
  color: var(--mc-text) !important;
  font-weight: 600 !important;
  font-size: 14px !important;
  font-family: var(--mc-font) !important;
  background: var(--mc-card) !important;
  padding: 12px 14px !important;
  border: none !important;
}

[data-testid="stExpander"] details > summary::-webkit-details-marker {
  display: none !important;
}

[data-testid="stExpander"] details > summary > span:first-child,
[data-testid="stExpander"] summary span[data-testid="stExpanderToggleIcon"] {
  font-size: 0 !important;
  line-height: 0 !important;
  width: 22px !important;
  height: 22px !important;
  min-width: 22px !important;
  flex-shrink: 0 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  background: var(--mc-sidebar2) !important;
  border: 1px solid var(--mc-border) !important;
  border-radius: 5px !important;
  overflow: hidden !important;
  color: transparent !important;
}

[data-testid="stExpander"] details > summary > span:first-child::after,
[data-testid="stExpander"] summary span[data-testid="stExpanderToggleIcon"]::after {
  content: "›" !important;
  font-size: 15px !important;
  font-weight: 700 !important;
  font-family: var(--mc-font) !important;
  color: var(--mc-muted) !important;
  line-height: 1 !important;
  display: block !important;
  transform: rotate(0deg) !important;
  transition: transform 0.15s ease !important;
}

[data-testid="stExpander"] details[open] > summary > span:first-child::after,
[data-testid="stExpander"] details[open] summary span[data-testid="stExpanderToggleIcon"]::after {
  transform: rotate(90deg) !important;
}

[data-testid="stExpander"] details > summary:hover {
  background: var(--mc-sidebar2) !important;
}

[data-testid="stExpander"] > div > div,
[data-testid="stExpander"] [data-testid="stExpanderDetails"] {
  background: var(--mc-card) !important;
  padding: 4px 16px 16px 48px !important;
  border-top: 1px solid var(--mc-border) !important;
  font-size: 14px !important;
  line-height: 1.5 !important;
}

[data-testid="stAlert"],
div[data-baseweb="notification"] {
  background: var(--mc-card) !important;
  border-radius: var(--mc-radius-sm) !important;
  border: 1px solid var(--mc-border) !important;
  border-left: 4px solid var(--mc-accent) !important;
  color: var(--mc-text) !important;
  font-size: 14px !important;
  line-height: 1.5 !important;
  padding: 12px 16px !important;
  box-shadow: none !important;
  margin: 8px 0 !important;
}

[data-testid="stAlert"] [data-testid="stMarkdownContainer"] p,
[data-testid="stAlert"] p {
  margin: 0 !important;
  font-size: 14px !important;
  color: var(--mc-text) !important;
}

.mc-live-banner {
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  padding: 10px 16px !important;
  margin: 10px 0 14px !important;
  background: rgba(14,203,129,0.10) !important;
  border: 1px solid rgba(14,203,129,0.28) !important;
  border-left: 4px solid var(--mc-up) !important;
  border-radius: var(--mc-radius-sm) !important;
  color: var(--mc-up) !important;
  font-size: 13px !important;
  font-weight: 500 !important;
  line-height: 1.45 !important;
}

.stTabs [data-baseweb="tab-list"] {
  background: transparent !important;
  border-bottom: 1px solid var(--mc-border) !important;
  gap: 0 !important;
}

.stTabs [data-baseweb="tab"] {
  color: var(--mc-muted) !important;
  font-weight: 500 !important;
  font-size: 13.5px !important;
  padding: 8px 16px !important;
  background: transparent !important;
  border-bottom: 2px solid transparent !important;
}

.stTabs [data-baseweb="tab"]:hover {
  color: var(--mc-text) !important;
  background: rgba(20,184,166,0.06) !important;
}

.stTabs [aria-selected="true"] {
  color: var(--mc-accent) !important;
  border-bottom: 2px solid var(--mc-accent) !important;
  font-weight: 600 !important;
  background: transparent !important;
}

.stTabs [data-testid="stTabsContent"] {
  background: transparent !important;
  padding-top: 14px !important;
}

/* İkincil butonlar (PDF hazırla vb.) — beyaz zemin + açık yazı YASAK */
.stButton > button,
.stButton > button[kind="secondary"],
.stButton > button[data-testid="baseButton-secondary"],
.stButton > button[data-testid="stBaseButton-secondary"],
button[kind="secondary"],
button[data-testid="baseButton-secondary"],
button[data-testid="stBaseButton-secondary"],
div[data-testid="stButton"] button,
section[data-testid="stMain"] button[kind="secondary"],
.main button[kind="secondary"] {
  background-color: #2B3139 !important;
  background-image: none !important;
  color: #EAECEF !important;
  -webkit-text-fill-color: #EAECEF !important;
  border: 1px solid #3a4149 !important;
  border-radius: var(--mc-radius-sm) !important;
  font-weight: 500 !important;
  font-size: 13px !important;
  font-family: var(--mc-font) !important;
  padding: 8px 16px !important;
  min-height: 36px !important;
  box-shadow: none !important;
}

.stButton > button:hover,
.stButton > button:focus,
.stButton > button:active,
button[kind="secondary"]:hover,
button[kind="secondary"]:focus,
button[data-testid="baseButton-secondary"]:hover,
button[data-testid="stBaseButton-secondary"]:hover {
  background-color: #3a4149 !important;
  background-image: none !important;
  border-color: #4a525c !important;
  color: #FFFFFF !important;
  -webkit-text-fill-color: #FFFFFF !important;
}

.stButton > button p,
.stButton > button span,
.stButton > button div,
.stButton > button[kind="secondary"] p,
.stButton > button[kind="secondary"] span,
button[kind="secondary"] p,
button[kind="secondary"] span,
div[data-testid="stButton"] button p,
div[data-testid="stButton"] button span {
  color: #EAECEF !important;
  -webkit-text-fill-color: #EAECEF !important;
}

/* Primary — ikincilden SONRA gelsin (üstün gelsin) */
.stButton > button[kind="primary"],
.stButton > button[data-testid="baseButton-primary"],
.stButton > button[data-testid="stBaseButton-primary"],
button[data-testid="baseButton-primary"],
button[data-testid="stBaseButton-primary"] {
  background-color: var(--mc-accent) !important;
  color: #0B1215 !important;
  border: none !important;
  border-radius: var(--mc-radius-sm) !important;
  font-weight: 600 !important;
  font-size: 13px !important;
  font-family: var(--mc-font) !important;
  padding: 8px 16px !important;
  min-height: 36px !important;
  transition: background 0.12s ease !important;
}

.stButton > button[kind="primary"]:hover,
button[data-testid="baseButton-primary"]:hover,
button[data-testid="stBaseButton-primary"]:hover {
  background-color: var(--mc-accent-h) !important;
  color: #0B1215 !important;
}

.stButton > button[kind="primary"] p,
.stButton > button[kind="primary"] span,
.stButton > button[data-testid="baseButton-primary"] p,
.stButton > button[data-testid="baseButton-primary"] span,
.stButton > button[data-testid="stBaseButton-primary"] p,
.stButton > button[data-testid="stBaseButton-primary"] span {
  color: #0B1215 !important;
}

.stDownloadButton > button,
[data-testid="stFormSubmitButton"] > button,
[data-testid="stDownloadButton"] button {
  background-color: var(--mc-accent) !important;
  color: #0B1215 !important;
  border: none !important;
  border-radius: var(--mc-radius-sm) !important;
  font-weight: 600 !important;
  font-family: var(--mc-font) !important;
  min-height: 36px !important;
}

.stDownloadButton > button:hover,
[data-testid="stFormSubmitButton"] > button:hover,
[data-testid="stDownloadButton"] button:hover {
  background-color: var(--mc-accent-h) !important;
  box-shadow: 0 0 0 3px rgba(20,184,166,0.22) !important;
  color: #0B1215 !important;
}

.stDownloadButton > button p,
.stDownloadButton > button span,
[data-testid="stDownloadButton"] button p,
[data-testid="stDownloadButton"] button span {
  color: #0B1215 !important;
}

/* Markdown tabloları (Neden? paneli) — koyu zemin, açık yazı */
[data-testid="stMarkdownContainer"] table,
[data-testid="stExpanderDetails"] table,
[data-testid="stExpander"] table,
.stMarkdown table {
  width: 100% !important;
  border-collapse: collapse !important;
  background-color: var(--mc-card) !important;
  color: var(--mc-text) !important;
  margin: 10px 0 14px !important;
  font-size: 13px !important;
}

[data-testid="stMarkdownContainer"] thead th,
[data-testid="stExpanderDetails"] thead th,
.stMarkdown thead th,
[data-testid="stMarkdownContainer"] th,
[data-testid="stExpanderDetails"] th,
.stMarkdown th {
  background-color: var(--mc-sidebar2) !important;
  color: var(--mc-text) !important;
  border: 1px solid var(--mc-border) !important;
  padding: 8px 10px !important;
  font-weight: 600 !important;
  text-align: left !important;
}

[data-testid="stMarkdownContainer"] td,
[data-testid="stExpanderDetails"] td,
.stMarkdown td {
  background-color: var(--mc-card) !important;
  color: var(--mc-text) !important;
  border: 1px solid var(--mc-border) !important;
  padding: 8px 10px !important;
}

[data-testid="stMarkdownContainer"] table *,
[data-testid="stExpanderDetails"] table *,
.stMarkdown table * {
  color: var(--mc-text) !important;
  border-color: var(--mc-border) !important;
}

[data-testid="stMarkdownContainer"] tbody tr:nth-child(even) td,
[data-testid="stExpanderDetails"] tbody tr:nth-child(even) td {
  background-color: #22272e !important;
}

/* Select / input — expander içi beyaz kutu + açık yazı */
[data-testid="stExpander"] div[data-baseweb="select"] > div,
[data-testid="stExpander"] div[data-baseweb="input"] > div,
[data-testid="stExpander"] input {
  background-color: var(--mc-sidebar2) !important;
  color: var(--mc-text) !important;
  border-color: var(--mc-border) !important;
}

div[data-baseweb="select"] > div,
div[data-baseweb="input"] > div {
  background-color: var(--mc-sidebar2) !important;
  border-color: var(--mc-border) !important;
  color: var(--mc-text) !important;
  border-radius: var(--mc-radius-sm) !important;
}

div[data-baseweb="select"] > div:focus-within,
div[data-baseweb="input"] > div:focus-within {
  border-color: var(--mc-accent) !important;
  box-shadow: 0 0 0 2px rgba(20,184,166,0.2) !important;
}

[data-testid="stNumberInput"] input,
[data-testid="stTextInput"] input {
  background: var(--mc-sidebar2) !important;
  border: 1px solid var(--mc-border) !important;
  color: var(--mc-text) !important;
  border-radius: var(--mc-radius-sm) !important;
}

[data-baseweb="menu"] {
  background: var(--mc-card) !important;
  border: 1px solid var(--mc-border) !important;
  border-radius: var(--mc-radius-sm) !important;
  box-shadow: 0 8px 24px rgba(0,0,0,0.45) !important;
}

[data-baseweb="menu"] li {
  color: var(--mc-text) !important;
  font-size: 13.5px !important;
}

[data-baseweb="menu"] li:hover,
[data-baseweb="menu"] li[aria-selected="true"] {
  background: rgba(20,184,166,0.12) !important;
  color: var(--mc-accent) !important;
}

[data-testid="stDataFrame"] {
  border: 1px solid var(--mc-border) !important;
  border-radius: var(--mc-radius) !important;
  overflow: hidden !important;
  background: var(--mc-card) !important;
  box-shadow: none !important;
}

[data-testid="stDataFrame"] table {
  background: var(--mc-card) !important;
}

[data-testid="stDataFrame"] th {
  background: var(--mc-sidebar2) !important;
  color: var(--mc-muted) !important;
  font-size: 11px !important;
  text-transform: uppercase !important;
  letter-spacing: 0.45px !important;
  font-weight: 600 !important;
  border-bottom: 1px solid var(--mc-border) !important;
}

[data-testid="stDataFrame"] td {
  color: var(--mc-text) !important;
  border-bottom: 1px solid var(--mc-border) !important;
  font-size: 13px !important;

<script>
(function () {
  function mcQueryNavigate(key, val, nav) {
    if (!key) return;
    try {
      var u = new URL(window.location.href);
      u.searchParams.set(key, String(val));
      if (nav) u.searchParams.set("mc_nav", nav);
      window.location.assign(u.href);
    } catch (err) {
      window.location.href = "?" + encodeURIComponent(key) + "=" + encodeURIComponent(val);
    }
  }
  document.addEventListener("click", function (ev) {
    var el = ev.target.closest(".mc-query-hit");
    if (!el) return;
    ev.preventDefault();
    ev.stopPropagation();
    mcQueryNavigate(
      el.getAttribute("data-qkey") || "",
      el.getAttribute("data-qval") || "",
      el.getAttribute("data-qnav") || ""
    );
  }, true);
})();
</script>
