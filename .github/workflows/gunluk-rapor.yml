name: Günlük TL Yatırım Raporu

# Her gün Türkiye saatiyle 09:00'da çalışır (06:00 UTC).
# GitHub Actions ücretsizdir, kendi bilgisayarınızın açık olmasına gerek yoktur.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # istediğiniz an "Run workflow" ile elle de tetikleyebilirsiniz

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Raporu oluştur ve Telegram'a gönder
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --alert-only
