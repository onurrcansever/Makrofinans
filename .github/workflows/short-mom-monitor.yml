name: Kısa Mom Haftalık İzleme

# Her Pazartesi 07:00 UTC (~10:00 TR) — ilk 30 günde kaçırma riskini azaltır
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  short-mom-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: pip install -q yfinance pandas numpy pyyaml
      - name: Kısa mom monitor
        id: mon
        continue-on-error: true
        run: |
          set +e
          python3 scripts/monitor_short_mom_live.py
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Rapor artefaktı
        uses: actions/upload-artifact@v4
        with:
          name: short-mom-monitor
          path: |
            signal_engine/reports/trend_short_mom_monitor_latest.json
          if-no-files-found: warn
      - name: Rollback eşiği aşıldı mı?
        if: steps.mon.outputs.exit == '2'
        run: |
          echo "::error::Kısa mom whipsaw eşiği aşıldı — signal_config.yaml short_momentum.enabled: false önerilir"
          cat signal_engine/reports/trend_short_mom_monitor_latest.json || true
          exit 1
