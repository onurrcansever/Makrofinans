name: AL Sinyal Alarmı

# Hafta içi saatlik AL/SAT — Mac kapalıyken de
on:
  schedule:
    - cron: "0 6-16 * * 1-5"
  workflow_dispatch: {}

jobs:
  sinyal:
    runs-on: ubuntu-latest
    env:
      BILDIRIM_KANALI: whatsapp
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
      INVESTOR_RISK: orta
      INVESTOR_VADE: kisa_6
      OZET_ALARM_HER_ZAMAN: "0"
      OZET_POZISYON_TABLO: "1"
      OZET_GOSTERIM_PB: EUR
      GITHUB_ACTIONS: "true"
      VARLIKLARIM_JSON: ${{ secrets.VARLIKLARIM_JSON }}
      TEMEL_VERI_CACHE_JSON: ${{ secrets.TEMEL_VERI_CACHE_JSON }}
      PORTFOY_YORUM_CACHE_JSON: ${{ secrets.PORTFOY_YORUM_CACHE_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .signal_state.json
          key: makrofinans-signal-state-v1
      - run: pip install -r requirements.txt
      - name: Portföy + cache geri yükle
        run: bash scripts/github_ci_restore.sh
      - name: AL/SAT değişim alarmı
        run: python main.py --sinyal-alarm --notify
